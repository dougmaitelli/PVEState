# Non-secret discovered backup topology. Changes to production remain manual.
pbs:
  endpoint: https://pbs.h4des.dev:8007
  version: "4.2"
  guest:
    type: lxc
    vmid: 111

  datastore:
    name: pve-backup
    backend: s3
    local_cache_path: /mnt/backup/
    bucket: hades-bkp
    s3_endpoint_id: backblaze
    garbage_collection_schedule: daily

  s3_endpoint:
    id: backblaze
    endpoint_template: "{{bucket}}.s3.{{region}}.backblazeb2.com"
    region: us-west-002

  jobs:
    prune:
      schedule: daily
    verify:
      schedule: "mon 23:00"
      ignore_verified: true
      outdated_after_days: 30

pve_backup_job:
  datastore: pve-backup
  schedule: "sun 01:00"
  mode: snapshot
  guest_ids: [102, 103, 105, 106, 107, 108, 111, 121]
  retention:
    keep_last: 3

---
- name: Apply reviewed Proxmox infrastructure changes
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Keep production apply safety-locked
      ansible.builtin.fail:
        msg: >-
          Production apply is safety-locked. The read-only plan must first be
          proven drift-free and resource mutation tasks must be reviewed before
          this gate can be deliberately replaced.

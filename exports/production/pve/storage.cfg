dir: local
	path /var/lib/vz
	content vztmpl,iso,backup

lvmthin: local-lvm
	thinpool data
	vgname pve
	content images,rootdir

zfspool: VMs
	pool VMs
	content rootdir,images
	mountpoint /VMs
	nodes pve
	sparse 1

zfspool: Data
	pool Data
	content rootdir,images
	mountpoint /Data
	nodes pve

pbs: pbs
	datastore pve-backup
	server pbs.h4des.dev
	content backup
	nodes pve
	prune-backups keep-all=1
	username backup@pbs


node: pve
lxcs:
  101:
    hostname: apps
    os: debian-13
    unprivileged: true
    cores: 2
    memory_mb: 2048
    swap_mb: 512
    rootfs: {storage: local-lvm, size_gb: 16}
    network:
      {name: eth0, mac: "02:00:00:00:01:01", bridge: vmbr0, firewall: true, ipv4: 192.0.2.101/24, gateway4: 192.0.2.1, ipv6: null, gateway6: null}
    additional_networks: []
    start: {onboot: true, order: 20, delay_seconds: 10}
    bind_mounts:
      - {source: /mnt/data/apps, target: /srv/data, backed_up_by_pve: false}
vms:
  201:
    name: home-automation
    machine: q35
    bios: ovmf
    cpu: {type: host, sockets: 1, cores: 2}
    memory_mb: 4096
    disk: {storage: local-lvm, interface: scsi0, size_gb: 32, discard: true}
    efi: {storage: local-lvm, pre_enrolled_keys: true}
    networks:
      - {model: virtio, mac: "02:00:00:00:02:01", bridge: vmbr0, firewall: true, vlan: null}
    usb_passthrough:
      - {slot: usb0, host: "1a86:7523"}
    qemu_guest_agent: true
    start: {onboot: true, order: 30, delay_seconds: null}

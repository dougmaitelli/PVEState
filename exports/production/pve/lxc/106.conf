arch: amd64
cmode: console
cores: 4
features: nesting=1
hostname: nvr
memory: 8192
mp0: /mnt/pve/security,mp=/mnt/security,backup=1
net0: name=net0,bridge=vmbr0,firewall=1,gw=192.168.0.1,hwaddr=BC:24:11:38:26:3E,ip=192.168.0.6/24,type=veth
net1: name=net1,bridge=vmbr1,hwaddr=F6:4A:7C:59:2B:C6,ip=192.168.7.6/24,type=veth
onboot: 1
ostype: ubuntu
rootfs: VMs:subvol-106-disk-0,size=16G
startup: order=4
swap: 0
tags: smarthome
lxc.apparmor.profile: unconfined
lxc.cap.drop: 
lxc.cgroup2.devices.allow: c 226:0 rwm
lxc.cgroup2.devices.allow: c 226:128 rwm
lxc.cgroup2.devices.allow: c 29:0 rwm
lxc.cgroup2.devices.allow: a
lxc.cgroup2.cpuset.cpus: 0-20
lxc.mount.entry: /dev/fb0 dev/fb0 none bind,optional,create=file
lxc.mount.entry: /dev/kfd dev/kfd none bind,optional,create=file
lxc.mount.entry: /dev/dri dev/dri none bind,optional,create=dir
lxc.mount.entry: /dev/dri/renderD128 dev/dri/renderD128 none bind,optional,create=file

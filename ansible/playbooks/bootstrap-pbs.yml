---
- name: Bootstrap PBS inside a replacement LXC
  hosts: all
  become: true
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    restore: "{{ lookup('file', repo_root + '/config/restore.yml') | from_yaml }}"
    guests: "{{ lookup('file', repo_root + '/config/guests.yml') | from_yaml }}"
    pbs: "{{ restore.pbs_bootstrap }}"
    guest: "{{ guests.lxcs[pbs.vmid] }}"
  tasks:
    - name: Check whether PBS container exists
      ansible.builtin.command: "pct status {{ pbs.vmid }}"
      register: pbs_status
      failed_when: false
      changed_when: false

    - name: Create PBS bootstrap container
      ansible.builtin.command:
        argv:
          - pct
          - create
          - "{{ pbs.vmid }}"
          - "{{ pbs.lxc_template }}"
          - --hostname
          - "{{ guest.hostname }}"
          - --cores
          - "{{ guest.cores }}"
          - --memory
          - "{{ guest.memory_mb }}"
          - --swap
          - "{{ guest.swap_mb }}"
          - --rootfs
          - "{{ guest.rootfs.storage }}:{{ guest.rootfs.size_gb }}"
          - --net0
          - "name=eth0,bridge={{ guest.network.bridge }},ip={{ guest.network.ipv4 }},gw={{ guest.network.gateway4 }}"
          - --unprivileged
          - "{{ 1 if guest.unprivileged else 0 }}"
          - --onboot
          - "{{ 1 if guest.start.onboot else 0 }}"
      when: pbs_status.rc != 0

    - name: Attach recovered PBS cache mount
      ansible.builtin.command:
        argv: [pct, set, "{{ pbs.vmid }}", -mp0, "/mnt/pve/backup,mp=/mnt/backup"]
      when: pbs_status.rc != 0

    - name: Start PBS container
      ansible.builtin.command: "pct start {{ pbs.vmid }}"
      register: pbs_start
      failed_when: pbs_start.rc != 0 and 'already running' not in pbs_start.stderr
      changed_when: pbs_start.rc == 0

    - name: Install Proxmox Backup Server package
      ansible.builtin.command: "pct exec {{ pbs.vmid }} -- sh -c 'apt-get update && apt-get install -y proxmox-backup-server'"
      changed_when: true

    - name: Explain required secret-backed S3 attachment
      ansible.builtin.debug:
        msg: >-
          PBS is bootstrapped. Attach the existing S3 datastore using the
          off-host Backblaze credentials, then generate a fresh rebuild plan.
          Secret material is intentionally not accepted as Ansible command-line arguments.

node:
  name: pve
  standalone: true
  pve_version: "9.0"
  kernel: example-pve
storage_topology:
  system:
    layout: lvmthin
    redundancy: none
    device_class: nvme
    provides: [local, local-lvm]
firewall:
  enabled: true
  rules:
    - {direction: IN, action: ACCEPT, interface: vmbr0, protocol: tcp, destination_port: "22", log: nolog, comment: SSH administration}

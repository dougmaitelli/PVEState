pbs:
  endpoint: https://pbs.example.test:8007
  version: "4.0"
  guest: {type: lxc, vmid: 111}
  datastore:
    name: example-backup
    backend: s3
    local_cache_path: /mnt/backup
    bucket: example-backups
    s3_endpoint_id: example
    garbage_collection_schedule: daily
  s3_endpoint:
    id: example
    endpoint_template: "{{bucket}}.s3.example.test"
    region: us-west-1
  jobs:
    prune:
      prune-example: {store: example-backup, schedule: daily}
    verify:
      verify-example: {store: example-backup, schedule: weekly, ignore_verified: true, outdated_after_days: 30}
    sync: {}
    absent_prune: []
    absent_verify: []
    absent_sync: []
pve_backup_jobs:
  backup-example:
    storage: pbs
    schedule: weekly
    mode: snapshot
    guest_ids: [101, 201]
    retention: {keep_last: 3}
absent_pve_backup_jobs: []

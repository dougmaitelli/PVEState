host_mounts:
  - {path: /mnt/pve/backup, required: true, purpose: pbs_cache_and_docker_bind_mount}
  - {path: /mnt/pve/security, required: true, purpose: nvr_bind_mount}

# Pool creation is deliberately separate: disk identities must be supplied on
# the replacement host and are never inferred from /dev/sdX names.
pools:
  - {name: VMs, type: zfspool, zpool: VMs, mountpoint: /VMs, content: [rootdir, images], sparse: true}
  - {name: Data, type: zfspool, zpool: Data, mountpoint: /Data, content: [rootdir, images]}
storages:
  - {name: local, type: dir, path: /var/lib/vz, content: [vztmpl, iso, backup]}
  - {name: local-lvm, type: lvmthin, vgname: pve, thinpool: data, content: [images, rootdir]}
  - {name: VMs, type: zfspool, pool: VMs, mountpoint: /VMs, content: [rootdir, images], sparse: true}
  - {name: Data, type: zfspool, pool: Data, mountpoint: /Data, content: [rootdir, images]}
  - {name: pbs, type: pbs, server: pbs.h4des.dev, datastore: pve-backup, username: backup@pbs, content: [backup]}

[package]
name = "pvestate"
version = "0.0.6"
edition = "2024"
license = "MIT"
description = "Safe desired-state, drift, and recovery tooling for Proxmox VE"
repository = "https://github.com/dougmaitelli/pvestate"
rust-version = "1.88"

[[bin]]
name = "pves"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
console = "0.16.4"
dotenvy = "0.15.7"
hex = "0.4.3"
indicatif = "0.18.6"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "form", "json", "rustls"] }
rustix = { version = "1.1.4", features = ["process"] }
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.20"
tempfile = "3.27.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

cluster:
  name: example
  environment: production
proxmox:
  endpoint: https://pve.example.test:8006
  existing_environment: true
  change_policy: reviewed
workload_profile:
  virtual_machines: 0
  containers: 0
backup:
  pbs:
    deployment: inside_proxmox
    endpoint: https://pbs.example.test:8007
  s3:
    configured_in_pbs: true
    endpoint: managed_in_pbs
# Omit tag_colors to leave overrides unmanaged. Use {} to clear all overrides.
# tag_colors:
#   production: {background: "008844", text: "ffffff"}
firewall:
  enabled: true
  log_level_in: info
  rules:
    - {direction: IN, action: ACCEPT, interface: vmbr0, protocol: tcp, destination_port: "8006", log: nolog, comment: Proxmox UI}

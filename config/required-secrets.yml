# Secret identifiers only. Values must live in an off-host secret manager.
required_for_disaster_recovery:
  pbs_s3:
    - backblaze_access_key_id
    - backblaze_secret_access_key
  pbs_identity:
    - root_or_recovery_admin_credential
    - tls_private_key_if_reusing_current_identity
  pve_to_pbs:
    - pbs_storage_api_token_id
    - pbs_storage_api_token_secret
    - pbs_tls_fingerprint_or_trusted_ca
  application:
    - docker_stack_env_files
    - home_assistant_recovery_key_if_configured
    - application_database_or_export_credentials

never_commit:
  - /etc/pve/priv/**
  - /etc/proxmox-backup/s3.cfg
  - /etc/proxmox-backup/token.shadow
  - /etc/proxmox-backup/shadow.json
  - /srv/stacks/**/.env

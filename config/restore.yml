schema_version: 1
target:
  expected_hostname: pve
  production_address: pve.h4des.dev
  plan_max_age_minutes: 30

pbs_bootstrap:
  vmid: 111
  datastore: pve-backup
  cache_path: /mnt/backup
  s3_endpoint_id: backblaze
  bucket: hades-bkp
  region: us-west-002
  # A fresh Debian template volume is required to break the PBS-in-PBS cycle.
  lxc_template: null
  # Set true only after completing the exclusive S3 takeover and adding the
  # recovered PBS storage to PVE as described in docs/pbs-bootstrap.md.
  storage_attached_to_pve: false

# Set each archive to a PBS volume ID selected during a recovery, for example:
# pbs:backup/vzdump-lxc-102-YYYY_MM_DD-HH_MM_SS.tar.zst
archives:
  102: null
  103: null
  105: null
  106: null
  107: null
  108: null
  121: null

restore_order: [102, 103, 105, 106, 107, 108, 121]
protected_vmids: [102, 103, 105, 106, 107, 108, 111, 121]
reattach_mounts:
  - {vmid: 105, index: 0, source: /mnt/pve/backup, target: /mnt/backup}
  - {vmid: 106, index: 0, source: /mnt/pve/security, target: /mnt/security}

application:
  repository: git@github.com:dougmaitelli/hades-server.git
  docker_guest_vmid: 105
  configure_playbook: null
